<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Release dependencies and vulnerability impact</title><desc id="desc">Checkout depends on payments, inventory and identity. Payments depends on ledger and serialization. Identity depends on serialization. Ledger depends on vulnerable ledger-db. Inventory and reporting have unaffected database dependencies.</desc>
