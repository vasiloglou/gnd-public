<svg aria-labelledby="gnd-orm-d4-title gnd-orm-d4-desc" class="gnd-figure" id="gnd-orm-d4" role="img" viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg">
  <title id="gnd-orm-d4-title">Alethic and deontic constraints</title>
  <desc id="gnd-orm-d4-desc">The fact type 'User is recommended Book' carries two footnoted rules: an alethic rule that fails the check and a deontic rule that only warns.</desc>
