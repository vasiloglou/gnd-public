version: 1
model_id: urn:gnd-v6-phase2:partition@1
source: { kind: text-conversation, confidence: standard, mode: guided }
object_types:
  - { id: person, name: Person, kind: entity, reference: { mode: popular, value_type: person_id } }
  - { id: person_id, name: PersonId, kind: value, primitive: String }
  - { id: age, name: Age, kind: value, primitive: Integer }
  - { id: term, name: Term, kind: value, primitive: Integer }
  - { id: student, name: Student, kind: entity, subtype_of: [person], inherits_reference: true, derivation: asserted }
  - { id: staff, name: Staff, kind: entity, subtype_of: [person], inherits_reference: true, derivation: asserted }
fact_types:
  - id: person_has_age
    reading: "{Person} has {Age}"
    roles:
      - { object_type: person, role_name: person }
      - { object_type: age, role_name: age }
  - id: student_enrolled
    reading: "{Student} is enrolled in {Term}"
    roles:
      - { object_type: student, role_name: student }
      - { object_type: term, role_name: term }
  - id: staff_employed
    reading: "{Staff} is employed in {Term}"
    roles:
      - { object_type: staff, role_name: staff }
      - { object_type: term, role_name: term }
constraints:
  - type: subtype-partition
    supertype: person
    subtypes: [student, staff]
    exclusive: true
    exhaustive: false
    source: explicit
    status: confirmed
    modality: alethic
    provenance: { csdp_step: 4, dialogue_turn: 1, user_quote: "Nobody is both student and staff." }
  - type: subtype-partition
    supertype: person
    subtypes: [student, staff]
    exclusive: false
    exhaustive: true
    source: explicit
    status: confirmed
    modality: alethic
    provenance: { csdp_step: 4, dialogue_turn: 2, user_quote: "Everybody is a student or staff." }
  - type: subtype-partition
    supertype: person
    subtypes: [student]
    exclusive: true
    exhaustive: false
    source: explicit
    status: confirmed
    modality: alethic
    provenance: { csdp_step: 4, dialogue_turn: 3, user_quote: "Students are not two things at once." }
  - type: subtype-partition
    supertype: person
    subtypes: [student]
    exclusive: false
    exhaustive: true
    source: explicit
    status: confirmed
    modality: alethic
    provenance: { csdp_step: 4, dialogue_turn: 4, user_quote: "Everybody is a student." }
