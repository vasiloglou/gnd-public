version: 1

source:
  kind: text-conversation
  confidence: standard
  mode: guided

object_types:
  - id: movie
    name: Movie
    kind: entity
    reference: { mode: popular, value_type: movie_id }

  - id: movie_id
    name: MovieId
    kind: value
    primitive: Integer

  - id: title
    name: Title
    kind: value
    primitive: String

fact_types:
  - id: movie_has_title
    reading: "{Movie} has title {Title}"
    roles:
      - { object_type: movie, role_name: movie }
      - { object_type: title, role_name: title }
    constraints:
      - type: uniqueness
        roles: [movie]
        source: explicit
        status: confirmed
        modality: alethic
        provenance:
          user_quote: "Each Movie has one canonical title in our catalog."
      - type: mandatory
        role: movie
        source: explicit
        status: confirmed
        modality: alethic
        provenance:
          user_quote: "Every movie must have a title."
