# IH2 T1: IL-close's ownref fixture with manager_no a String, so manager "1" and
# staff "1" are one value to the checker but two families to the count. Synthetic.
version: 1
model_id: ownref_string
source:
  kind: fixture
object_types:
  - id: staff
    name: Staff
    kind: entity
    reference: { mode: popular, value_type: staff_code }
  - id: staff_code
    name: StaffCode
    kind: value
    primitive: String
  - id: manager
    name: Manager
    kind: entity
    subtype_of: [staff]
    inherits_reference: false
    reference: { mode: popular, value_type: manager_no }
    derivation: asserted
  - id: manager_no
    name: ManagerNo
    kind: value
    primitive: String
  - id: team
    name: Team
    kind: entity
    reference: { mode: popular, value_type: team_code }
  - id: team_code
    name: TeamCode
    kind: value
    primitive: String
fact_types:
  - id: manages
    reading: "{Manager} manages {Team}"
    roles:
      - { object_type: manager, role_name: manager }
      - { object_type: team, role_name: team }
  - id: works_in
    reading: "{Staff} works in {Team}"
    roles:
      - { object_type: staff, role_name: staff }
      - { object_type: team, role_name: team }
