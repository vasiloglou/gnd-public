%YAML 1.1
---
version: 0.3.0.dev0
name: gnd_model_relational
datasets:
- name: customer
  source: customer
  primary_key:
  - customer_id
  fields:
  - name: customer_id
    expression:
      sql: '"CUSTOMER_ID"'
    datatype: Integer
  - name: email
    expression:
      sql: '"EMAIL"'
    datatype: String
  custom_extensions:
  - vendor_name: GND
    data: '{"source_kind":"logical"}'
