name: Prepare or publish release artifacts
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated artifacts to PyPI (requires configured Trusted Publisher)'
        type: boolean
        default: false
concurrency:
  group: pypi-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.10'
      - run: uv build --out-dir candidate/release
      - name: Rebuild comparison wheel separately
        run: |
          mkdir -p candidate/source
          tar -xzf candidate/release/*.tar.gz -C candidate/source
          uv build --wheel candidate/source/* --out-dir "$PWD/candidate/comparison"
      - name: Record identities
        run: |
          rm -f candidate/release/.gitignore candidate/comparison/.gitignore
          git rev-parse HEAD > candidate/SOURCE_COMMIT
          python --version > candidate/BUILD_PROFILE
          uv --version >> candidate/BUILD_PROFILE
          cd candidate
          sha256sum release/* comparison/* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preparation-${{ github.sha }}-${{ github.run_id }}
          path: |
            candidate/release/
            candidate/comparison/
            candidate/SHA256SUMS
            candidate/SOURCE_COMMIT
            candidate/BUILD_PROFILE
          if-no-files-found: error
          retention-days: 30
      - run: uv sync --locked --group dev
      - name: Validate the retained candidate without rebuilding
        run: GND_CANDIDATE_DIR="$PWD/candidate" uv run pytest -q -o addopts='' tests/test_release_acceptance.py --tb=short
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/get-nick-done/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preparation-${{ github.sha }}-${{ github.run_id }}
          path: candidate
      - name: Verify the validated source and artifact identities
        working-directory: candidate
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(cat SOURCE_COMMIT)" = "$EXPECTED_COMMIT"
          sha256sum -c SHA256SUMS
      - name: Publish the release wheel and sdist, never the comparison wheel
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: candidate/release/
          attestations: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.10'
      - name: Compare served PyPI files and exercise a fresh index install
        run: |
          python - <<'PYTHON'
          import hashlib, json, pathlib, urllib.request, zipfile
          from email.parser import BytesParser
          release = pathlib.Path('candidate/release')
          wheel = next(release.glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              metadata = BytesParser().parsebytes(archive.read(next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))))
          version = metadata['Version']
          with urllib.request.urlopen(f'https://pypi.org/pypi/get-nick-done/{version}/json', timeout=60) as response:
              published = json.load(response)
          served = {item['filename']: item for item in published['urls']}
          for artifact in release.iterdir():
              expected = hashlib.sha256(artifact.read_bytes()).hexdigest()
              item = served[artifact.name]
              assert item['digests']['sha256'] == expected, artifact.name
              with urllib.request.urlopen(item['url'], timeout=60) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == expected, artifact.name
          pathlib.Path('published-version.txt').write_text(version)
          PYTHON
          uv venv installed
          uv pip install --python installed/bin/python --index-url https://pypi.org/simple "get-nick-done==$(cat published-version.txt)"
          installed/bin/gnd --help
          installed/bin/python -I - <<'PYTHON'
          from importlib.resources import files
          from gnd import api
          root = files('gnd') / 'examples' / 'dispatch'
          for name, expected in [('seed.pop.json', 1), ('repaired.pop.json', 0)]:
              result = api.check(root / 'model.orm.json', root / name, admission=True)
              assert result['exit_code'] == expected, result
          print('Fresh PyPI install rejected the invalid plan and accepted its repair.')
          PYTHON
