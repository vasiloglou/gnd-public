version: 1
source:
  kind: text-conversation
  confidence: standard
  mode: guided
object_types:
- id: country
  name: Country
  kind: entity
  reference:
    mode: popular
    value_type: country_code
- id: country_code
  name: CountryCode
  kind: value
  primitive: String
- id: state
  name: State
  kind: entity
  reference:
    mode: external
- id: state_code
  name: StateCode
  kind: value
  primitive: String
- id: district
  name: District
  kind: entity
  reference:
    mode: external
- id: district_nr
  name: DistrictNr
  kind: value
  primitive: Integer
- id: seats
  name: Seats
  kind: value
  primitive: Integer
fact_types:
- id: state_in_country
  reading: '{State} is in {Country}'
  roles:
  - object_type: state
    role_name: state
  - object_type: country
    role_name: country
  constraints:
  - type: uniqueness
    roles:
    - state
    source: explicit
    status: confirmed
    modality: alethic
    provenance:
      user_quote: Each is unique.
  - type: mandatory
    role: state
    source: explicit
    status: confirmed
    modality: alethic
    provenance:
      user_quote: Each must have one.
- id: state_has_code
  reading: '{State} has {StateCode}'
  roles:
