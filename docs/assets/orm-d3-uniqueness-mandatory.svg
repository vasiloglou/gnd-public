<svg aria-labelledby="gnd-orm-d3-title gnd-orm-d3-desc" class="gnd-figure" id="gnd-orm-d3" role="img" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
  <title id="gnd-orm-d3-title">Uniqueness and mandatory constraints in ORM 2 notation</title>
  <desc id="gnd-orm-d3-desc">Book (entity) and Genre (value type, dashed) joined by 'has primary genre'. A uniqueness bar covers the Book role and a mandatory dot sits on the Book end.</desc>
