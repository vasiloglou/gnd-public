<path d="M398 548L478 548" stroke="#334155" stroke-width="1.5"/>
<text x="40" y="600" class="mono green">item_has_attribute_induced_2</text>
<text x="40" y="624" class="small">each (item, value) pair recorded once · says nothing about how many values</text>
<text x="40" y="648" class="small">support 36 distinct pairs of 37 rows · counterexample <tspan class="mono orange">ft0#132</tspan>, a repeated pair</text>
