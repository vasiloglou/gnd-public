# IK4 approval corpus: the base model. Synthetic and anonymized (IK-R10).
# Declares no constraints, so every candidate is new.
version: 1
model_id: ik4-staff
source:
  kind: fixture
object_types:
  - id: person
    name: Person
    kind: entity
    reference: { mode: popular, value_type: person_id }
  - id: person_id
    name: PersonId
    kind: value
    primitive: Integer
  - id: team
    name: Team
    kind: entity
    reference: { mode: popular, value_type: team_code }
  - id: team_code
    name: TeamCode
    kind: value
    primitive: String
  - id: grade
    name: Grade
    kind: value
    primitive: String
  - id: skill
    name: Skill
    kind: value
    primitive: String
fact_types:
  - id: person_in_team
    reading: "{Person} is in {Team}"
    roles:
      - { object_type: person, role_name: person }
      - { object_type: team, role_name: team }
  - id: person_has_grade
    reading: "{Person} has {Grade}"
    roles:
      - { object_type: person, role_name: person }
      - { object_type: grade, role_name: grade }
  - id: team_led_by
    reading: "{Team} is led by {Person}"
    roles:
      - { object_type: team, role_name: team }
      - { object_type: person, role_name: leader }
  - id: person_has_skill
    reading: "{Person} has {Skill}"
    roles:
      - { object_type: person, role_name: person }
      - { object_type: skill, role_name: skill }
constraints: []
