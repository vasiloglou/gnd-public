# Two contracts, one party, one question: which city is each contract's party
# based in? (docs/how-to/compose-documents.md)
version: 2
model_id: composition-contracts
source: { kind: text-conversation, confidence: standard, mode: one-shot }
object_types:
  - { id: contract, name: Contract, kind: value, primitive: String }
  - { id: party, name: Party, kind: value, primitive: String }
  - { id: city, name: City, kind: value, primitive: String }
fact_types:
  - id: contract_has_party
    reading: "{Contract} has party {Party}"
    roles:
      - { object_type: contract, role_name: contract }
      - { object_type: party, role_name: party }
    constraints:
      # Every party must be found in the document the fact was extracted from.
      - type: anchored
        role: party
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "A party is only as good as the passage that names it." }
  - id: party_is_based_in_city
    reading: "{Party} is based in {City}"
    roles:
      - { object_type: party, role_name: party }
      - { object_type: city, role_name: city }
    constraints:
      # Every city must be found in the document the fact was extracted from.
      - type: anchored
        role: city
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "The seat is written in the contract." }
      # A party is based in one city.
      - type: uniqueness
        roles: [party]
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "A party has one registered seat." }
  - id: contract_is_in_city
    reading: "{Contract} is in {City}"
    roles:
      - { object_type: contract, role_name: contract }
      - { object_type: city, role_name: city }
    derivation: derived
    derivation_rule:
      body:
        - { fact_type: contract_has_party, bind: { contract: "$c", party: "$p" } }
        - { fact_type: party_is_based_in_city, bind: { party: "$p", city: "$x" } }
      head: { contract: "$c", city: "$x" }
constraints: []
