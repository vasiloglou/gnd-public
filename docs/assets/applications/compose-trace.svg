<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><title id="title">The trace from the derived answer to a span in each document</title><desc id="desc">At the top, the derived answer: C-2 is in Lyon, proved by the rule. Below it two base facts. Acme Corp. is based in Lyon, from contract-a and contract-b, points at the sentence The supplier, Acme Corp., is based in Lyon. in the agreement and at ACME CORP. is based in Lyon. in the addendum. C-2 has party Acme Corp., from contract-b, points at Addendum C-2 is signed by ACME CORP. as the supplier. in the addendum. The addendum's spans are found under the name that document uses.</desc><style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:18px} .title{font-size:24px;font-weight:700} .small{font-size:15px} .strong{font-weight:700} .mid{text-anchor:middle} rect{stroke:#50657a;stroke-width:1.5} .edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px} .derived{stroke-dasharray:6 4} .span{fill:#fff3bf;stroke:#b45309;stroke-width:1.5} .caps{fill:#b45309;font-weight:700} .quote{font-style:italic}</style><rect width="640" height="640" fill="#fff" stroke="none"/>
