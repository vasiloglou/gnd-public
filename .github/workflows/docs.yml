name: Documentation
on:
  pull_request:
    paths: ['docs/**', 'overrides/**', 'README.md', 'zensical.toml', 'pyproject.toml', 'uv.lock', 'src/gnd/examples/**', 'tools/*docs*', 'tools/run_tutorials.py', 'tests/test_documentation_tutorials.py', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: 'Publish only after Phase 5 authorization'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.10'
      - run: uv sync --locked --group docs --group dev
      - run: uv run python tools/run_tutorials.py
      - run: uv run --group docs zensical build --strict
      - run: uv run python tools/check_docs.py site
      - name: Identify preview
        run: git rev-parse HEAD > site/SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-${{ github.sha }}
          path: site/
          retention-days: 30
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && vars.GND_DOCS_PUBLISH == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: documentation-${{ github.sha }}
          path: site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
