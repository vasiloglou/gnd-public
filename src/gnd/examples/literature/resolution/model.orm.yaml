# The model of the LI2 resolution fixtures
# (.gnd-planning/milestones/literature-identity/notes/phase-LI2-spec.md §6.6).
# Methods are named by the spelling a source uses, as in the flat corpus
# model. Lineage is the recursive closure of builds-on, so a false merge
# shows up as a false ancestor. Mentions model one spelling with two senses
# inside one document (spec §6.5).
version: 2
model_id: urn:gnd-example:literature-resolution@1
source: { kind: text-conversation, confidence: standard, mode: one-shot }
object_types:
  - { id: method, name: Method, kind: value, primitive: String }
  - { id: mention, name: Mention, kind: value, primitive: String }
  - { id: surface, name: Surface, kind: value, primitive: String }
  - { id: sense, name: Sense, kind: value, primitive: String }
fact_types:
  - id: method_builds_on_method
    reading: "{Method} builds on {Method}"
    roles:
      - { object_type: method, role_name: method }
      - { object_type: method, role_name: base_method }
    constraints:
      - type: anchored
        role: method
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "Both ends of a builds-on statement are named in its passage." }
      - type: anchored
        role: base_method
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "Both ends of a builds-on statement are named in its passage." }
  - id: method_has_ancestor_method
    reading: "{Method} has ancestor {Method}"
    roles:
      - { object_type: method, role_name: method }
      - { object_type: method, role_name: ancestor }
    derivation: derived
    derivation_rule:
      clauses:
        - body: [{ fact_type: method_builds_on_method, bind: { method: "$m", base_method: "$a" } }]
          head: { method: "$m", ancestor: "$a" }
        - body:
            - { fact_type: method_builds_on_method, bind: { method: "$m", base_method: "$x" } }
            - { fact_type: method_has_ancestor_method, bind: { method: "$x", ancestor: "$a" } }
          head: { method: "$m", ancestor: "$a" }
  - id: mention_has_surface_text
    reading: "{Mention} has surface text {Surface}"
    roles:
      - { object_type: mention, role_name: mention }
      - { object_type: surface, role_name: surface }
    constraints:
      - type: anchored
        role: surface
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "A mention's surface text is the text at its span." }
      - type: uniqueness
        roles: [mention]
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "A mention has one surface text." }
  - id: mention_denotes_sense
    reading: "{Mention} denotes {Sense}"
    roles:
      - { object_type: mention, role_name: mention }
      - { object_type: sense, role_name: sense }
    constraints:
      - type: uniqueness
        roles: [mention]
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "A reviewed mention denotes one sense." }
constraints: []
