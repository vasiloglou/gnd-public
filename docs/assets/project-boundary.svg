<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="title desc"><title id="title">Who writes each part of a GND application</title><desc id="desc">A reviewed domain model feeds generated tools and schemas. The developer or agent writes application logic in extension files. Both are checked for agreement by conformance. Application output is checked against the model at runtime.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#164f4b"/></marker></defs><rect width="800" height="270" rx="16" fill="#f1f4ef"/><g font-family="system-ui,sans-serif" fill="#183936"><text x="27" y="35" font-size="13" letter-spacing="2">GENERATED STRUCTURE + AUTHORED BEHAVIOR</text><rect x="27" y="67" width="207" height="138" rx="10" fill="#fff" stroke="#b7cec5"/><text x="44" y="99" font-size="19" font-weight="600">Your domain model</text><text x="44" y="128" font-size="14">Relationships and rules</text><text x="44" y="151" font-size="14">Reviewed by you</text><text x="44" y="186" font-size="13">Agent-assisted authoring</text><path d="M239 116H280" stroke="#164f4b" stroke-width="2" marker-end="url(#a)"/><rect x="291" y="67" width="225" height="138" rx="10" fill="#dcece3"/><text x="308" y="99" font-size="19" font-weight="600">GND generates</text><text x="308" y="128" font-size="14">Model tools and schemas</text><text x="308" y="151" font-size="14">Project scaffolding</text><text x="308" y="186" font-size="13">Derived files stay traceable</text><path d="M522 136H559" stroke="#164f4b" stroke-width="2" marker-end="url(#a)"/><rect x="570" y="67" width="203" height="138" rx="10" fill="#f7e0cf"/><text x="587" y="99" font-size="19" font-weight="600">You / agent write</text><text x="587" y="128" font-size="14">Application logic</text><text x="587" y="151" font-size="14">CLI, integration, tests</text><text x="587" y="186" font-size="13">Extension files stay yours</text><path d="M405 208V238H672V208" fill="none" stroke="#164f4b" stroke-width="2"/><text x="412" y="258" font-size="13">Conformance checks their declared agreement</text></g></svg>