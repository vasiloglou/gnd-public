version: 2
source: {kind: fixture}
object_types:
  - {id: coefficient, name: Coefficient, kind: value, primitive: Integer}
  - {id: decimal_places, name: DecimalPlaces, kind: value, primitive: Integer}
  - {id: time_unit, name: TimeUnit, kind: value, primitive: String}
fact_types:
  - id: time_step
    reading: "{Coefficient} denotes a time step with {DecimalPlaces} decimal places in {TimeUnit}"
    roles:
      - {role_name: coefficient, object_type: coefficient}
      - {role_name: places, object_type: decimal_places}
      - {role_name: unit, object_type: time_unit}
    constraints:
      - type: anchored
        role: coefficient
        recognise: [time-fs]
        source: user-supplied
        status: confirmed
        modality: alethic
        provenance: {user_quote: "The coefficient is the source time step in whole femtoseconds."}
      - type: value
        object_type: decimal_places
        role_ref: {fact_type: time_step, role: places}
        allowed: [3]
        source: user-supplied
        status: confirmed
        modality: alethic
        provenance: {user_quote: "The picosecond representation uses exactly three decimal places."}
      - type: value
        object_type: time_unit
        role_ref: {fact_type: time_step, role: unit}
        allowed: [ps]
        source: user-supplied
        status: confirmed
        modality: alethic
        provenance: {user_quote: "The displayed unit for this exact decimal representation is ps."}
