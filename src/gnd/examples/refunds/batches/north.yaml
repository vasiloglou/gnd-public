    - { refund: 103, customer: "c-cara" }
  refund_amount:
    - { refund: 101, amount: 40 }
    - { refund: 102, amount: 120 }
    - { refund: 103, amount: 75 }
  refund_channel:
    - { refund: 101, channel: "card" }
    - { refund: 102, channel: "card" }
    - { refund: 103, channel: "cash" }
