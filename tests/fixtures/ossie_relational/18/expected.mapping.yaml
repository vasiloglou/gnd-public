%YAML 1.1
---
version: 0.3.0.dev0
name: gnd_model_mapping
ontology_ref:
  name: gnd_model
  iri: ./ontology.yaml
semantic_model_ref:
  name: gnd_model_relational
  iri: ./ontology.yaml.semantic_model.yaml
concept_mappings:
- concept: Person
  object_mappings:
  - expression: '"PERSON"."PERSON_ID"'
  link_mappings:
  - object_mapping:
      expression: '"PERSON"."PERSON_ID"'
    children:
    - object_mapping:
        concept: PersonName
        expression: '"PERSON"."NAME"'
      relationship: person_has_name
  - object_mapping:
      expression: '"PERSON"."PERSON_ID"'
    children:
    - object_mapping:
        concept: BirthYear
        expression: '"PERSON"."BIRTH_YEAR"'
      relationship: person_has_birth_year
  - object_mapping:
      expression: '"PERSON"."PERSON_ID"'
    children:
    - object_mapping:
        concept: Nickname
        expression: '"PERSON"."NICKNAME"'
      relationship: person_has_nickname
