<svg aria-labelledby="gnd-orm-d5-title gnd-orm-d5-desc" class="gnd-figure" id="gnd-orm-d5" role="img" viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg">
  <title id="gnd-orm-d5-title">A derived fact type in ORM 2 notation</title>
  <desc id="gnd-orm-d5-desc">The fact type 'Book is eligible for User' is marked with an asterisk and defined by a rule using preferences, genres, blocking and ratings.</desc>
  <style>:where(#gnd-orm-d5){--gf-bg:#f1f4ef;--gf-card:#ffffff;--gf-line:#b7cec5;--gf-ink:#183936;--gf-muted:#5b6f6b;--gf-primary:#164f4b;--gf-accent:#b34e26;--gf-ok:#1f7a4d;--gf-ok-bg:#dcece3;--gf-fail:#b3261e;--gf-fail-bg:#f7dcd6;--gf-warn:#8a5e00;--gf-warn-bg:#fbecc2;--gf-bubble:#164f4b;--gf-bubble-ink:#ffffff;--gf-code:#f6f8f5;--gf-alethic:#6b3fa0;--gf-deontic:#1f5fa8}@media (prefers-color-scheme: dark){:where(#gnd-orm-d5){--gf-bg:#1b2b28;--gf-card:#0f1917;--gf-line:#2d4440;--gf-ink:#e6efec;--gf-muted:#9fb3ae;--gf-primary:#7bd4c6;--gf-accent:#ffb38b;--gf-ok:#6fd39a;--gf-ok-bg:#163b2b;--gf-fail:#ff8f85;--gf-fail-bg:#4a1f1b;--gf-warn:#f2c14e;--gf-warn-bg:#4a3a10;--gf-bubble:#123d39;--gf-bubble-ink:#e6efec;--gf-code:#142320;--gf-alethic:#c3a6ff;--gf-deontic:#8ab8ff}}#gnd-orm-d5 .f-bg{fill:var(--gf-bg)}#gnd-orm-d5 .f-card{fill:var(--gf-card)}#gnd-orm-d5 .f-line{fill:var(--gf-line)}#gnd-orm-d5 .f-ink{fill:var(--gf-ink)}#gnd-orm-d5 .f-muted{fill:var(--gf-muted)}#gnd-orm-d5 .f-primary{fill:var(--gf-primary)}#gnd-orm-d5 .f-accent{fill:var(--gf-accent)}#gnd-orm-d5 .f-ok{fill:var(--gf-ok)}#gnd-orm-d5 .f-ok-bg{fill:var(--gf-ok-bg)}#gnd-orm-d5 .f-fail{fill:var(--gf-fail)}#gnd-orm-d5 .f-fail-bg{fill:var(--gf-fail-bg)}#gnd-orm-d5 .f-warn{fill:var(--gf-warn)}#gnd-orm-d5 .f-warn-bg{fill:var(--gf-warn-bg)}#gnd-orm-d5 .f-bubble{fill:var(--gf-bubble)}#gnd-orm-d5 .f-bubble-ink{fill:var(--gf-bubble-ink)}#gnd-orm-d5 .f-code{fill:var(--gf-code)}#gnd-orm-d5 .f-alethic{fill:var(--gf-alethic)}#gnd-orm-d5 .f-deontic{fill:var(--gf-deontic)}#gnd-orm-d5 .s-bg{stroke:var(--gf-bg)}#gnd-orm-d5 .s-card{stroke:var(--gf-card)}#gnd-orm-d5 .s-line{stroke:var(--gf-line)}#gnd-orm-d5 .s-ink{stroke:var(--gf-ink)}#gnd-orm-d5 .s-muted{stroke:var(--gf-muted)}#gnd-orm-d5 .s-primary{stroke:var(--gf-primary)}#gnd-orm-d5 .s-accent{stroke:var(--gf-accent)}#gnd-orm-d5 .s-ok{stroke:var(--gf-ok)}#gnd-orm-d5 .s-ok-bg{stroke:var(--gf-ok-bg)}#gnd-orm-d5 .s-fail{stroke:var(--gf-fail)}#gnd-orm-d5 .s-fail-bg{stroke:var(--gf-fail-bg)}#gnd-orm-d5 .s-warn{stroke:var(--gf-warn)}#gnd-orm-d5 .s-warn-bg{stroke:var(--gf-warn-bg)}#gnd-orm-d5 .s-bubble{stroke:var(--gf-bubble)}#gnd-orm-d5 .s-bubble-ink{stroke:var(--gf-bubble-ink)}#gnd-orm-d5 .s-code{stroke:var(--gf-code)}#gnd-orm-d5 .s-alethic{stroke:var(--gf-alethic)}#gnd-orm-d5 .s-deontic{stroke:var(--gf-deontic)}#gnd-orm-d5 .sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}#gnd-orm-d5 .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;white-space:pre}#gnd-orm-d5 .nofill{fill:none}</style>
  <rect class="f-bg" height="290" rx="16" width="720" x="0" y="0"/>
  <text class="sans f-muted" font-size="12" font-weight="600" letter-spacing="2" x="24" y="32">ORM 2 · DERIVED FACT TYPE</text>
  <g>
    <rect class="f-card s-primary" height="52" rx="12" stroke-width="2" width="130" x="60" y="52"/>
    <text class="sans f-ink" font-size="16" font-weight="600" text-anchor="middle" x="125" y="75">Book</text>
    <text class="sans f-muted" font-size="12" text-anchor="middle" x="125" y="93">(.id)</text>
  </g>
  <g>
    <rect class="f-card s-primary" height="52" rx="12" stroke-width="2" width="130" x="530" y="52"/>
    <text class="sans f-ink" font-size="16" font-weight="600" text-anchor="middle" x="595" y="75">User</text>
    <text class="sans f-muted" font-size="12" text-anchor="middle" x="595" y="93">(.id)</text>
  </g>
  <line class="s-ink" stroke-width="1.6" x1="190" x2="324" y1="78" y2="78"/>
  <line class="s-ink" stroke-width="1.6" x1="396" x2="530" y1="78" y2="78"/>
  <g>
    <rect class="f-card s-ink" height="22" stroke-width="1.6" width="36" x="324" y="67"/>
    <rect class="f-card s-ink" height="22" stroke-width="1.6" width="36" x="360" y="67"/>
  </g>
  <line class="s-alethic" stroke-linecap="round" stroke-width="2.6" x1="327" x2="393" y1="61" y2="61"/>
  <text class="sans f-ink" font-size="15" font-style="italic" text-anchor="middle" x="360" y="112">… is eligible for … *</text>
  <rect class="f-card s-line" height="100" rx="12" stroke-width="1.5" width="640" x="40" y="136"/>
  <text class="sans f-ink" font-size="14" font-weight="600" x="58" y="162">* Book is eligible for User if</text>
  <text class="sans f-ink" font-size="14" x="58" y="184">User prefers some Genre and Book has primary genre that Genre,</text>
  <text class="sans f-ink" font-size="14" x="58" y="206">and Book is not blocked for User, and User has not rated Book.</text>
  <text class="sans f-muted" font-size="12" x="58" y="226">(negation is stratified)</text>
  <text class="sans f-muted" font-size="13" x="40" y="266">Computed by the rule, never supplied. Unknown inputs yield cannot-decide, not yes or no.</text>
</svg>
