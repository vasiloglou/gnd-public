<svg aria-labelledby="gnd-hero-title gnd-hero-desc" class="gnd-figure" id="gnd-hero" role="img" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <title id="gnd-hero-title">An agent's plan checked by GND</title>
  <desc id="gnd-hero-desc">Asked to reimburse expense 41, the agent proposes a plan that pays it directly. GND checks the plan against the model: the pre_submitted precondition fails and pre_has_approver warns. With that feedback the agent adds the approval and Workday steps; the revised plan passes and the expense is paid.</desc>
