[project]
site_name = "GND"
site_description = "Build agentic data apps that check themselves. Inspired by GSD: an executable ORM ontology verified by GND, Soufflé, Lean or PyRel."
site_url = "https://vasiloglou.github.io/gnd-public/"
repo_url = "https://github.com/vasiloglou/gnd-public"
repo_name = "gnd-public"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/styles.css"]
extra_javascript = ["assets/application-diagrams.js"]
nav = [
  { "Overview" = [{ "What is GND?" = "index.md" }, { "ORM: the executable ontology" = "concepts.md" }, { "Capabilities tour" = "tour.md" }, { "Application gallery" = "applications.md" }] },
  { "Get started" = [{ "Install GND and the skills" = "installation.md" }, { "Claude Code and Codex plugins" = "marketplace-plugins.md" }, { "Run a check in 60 seconds" = "quickstart.md" }, { "Release dependencies" = "release-example.md" }] },
  { "Work with an agent" = [{ "Skills + Python: who does what" = "agents/index.md" }, { "Install the skills" = "agents/install.md" }, { "Check an agent's plan" = "agents/plans.md" }, { "Model a domain by dialogue" = "agents/model-from-text.md" }, { "Drive an agent against the verifier" = "agents/dev-session.md" }, { "Recorded agent sessions" = "agents/recorded-sessions.md" }, { "Generate a project and keep it aligned" = "agents/codegen-conformance.md" }, { "Change the rules safely" = "agents/evolve.md" }, { "Documents in, documents out" = "agents/documents.md" }, { "Exports and a second opinion" = "agents/export-and-review.md" }, { "The station walk" = "walkthrough.md" }] },
  { "Tutorials" = [
    { "Build a course planner" = "tutorials/course-planner.md" },
    { "Refill prescriptions on a schedule" = "tutorials/clinic-refills.md" },
    { "PyRel + GND: rules to a checked app" = "pyrel-apps.md" },
    { "Build BookRec" = [{ "1. Model the problem" = "bookrec/01-model.md" }, { "2. Facts and rules" = "bookrec/02-facts.md" }, { "3. Generate a project" = "bookrec/03-project.md" }, { "4. Build the application" = "bookrec/04-application.md" }, { "5. Diagnose and repair" = "bookrec/05-repair.md" }, { "6. Evolve the rules" = "bookrec/06-evolution.md" }, { "7. Run on PyRel, put an agent in the loop" = "bookrec/07-native.md" }] },
    { "Expense approvals" = [{ "1. Model the workflow" = "expense/01-model.md" }, { "2. Build and check" = "expense/02-application.md" }, { "3. Add currencies" = "expense/03-evolution.md" }, { "4. Run on PyRel, put an agent in the loop" = "expense/04-native.md" }] }
  ] },
  { "How-to guides" = [{ "Stop a manager approving their report's access" = "how-to/access-requests.md" }, { "Keep a trip under budget" = "how-to/trip-budget.md" }, { "Schedule rent inside a lease" = "how-to/lease-schedule.md" }, { "Read the recorded model runs" = "how-to/model-runs.md" }] },
  { "Explanation" = [{ "What PyRel is, and when you need it" = "explanation/what-is-pyrel.md" }, { "How a rule becomes a PyRel check" = "explanation/rules-as-pyrel.md" }] },
  { "Verify at scale" = [{ "Release governance across runtimes" = "runtimes/scenario.md" }, { "PyRel: approval audits" = "runtimes/pyrel.md" }, { "Soufflé: dependency impact" = "runtimes/souffle.md" }, { "Lean: policy proofs" = "runtimes/lean.md" }, { "Interpret the evidence" = "runtimes/decision.md" }] },
  { "Guides (CLI and Python)" = [{ "Models and constraints" = "guides/modeling.md" }, { "Data and transitions" = "guides/data-and-transitions.md" }, { "Synthetic data" = "guides/synthetic-data.md" }, { "Generated projects" = "guides/generated-projects.md" }, { "Evolution and recovery" = "guides/evolution-and-recovery.md" }, { "Documents and extraction" = "guides/documents.md" }, { "Experiment sessions" = "guides/experiments.md" }, { "Exports and witnesses" = "guides/exports.md" }] },
  { "Reference" = [{ "Supported capabilities" = "reference/capabilities.md" }, { "CLI task index" = "reference/cli.md" }, { "Constraint discovery" = "reference/discover.md" }, { "Measuring host labels" = "reference/measure-labels.md" }, { "Python API" = "reference/python-api.md" }, { "Formats and errors" = "reference/formats.md" }, { "Support" = "support.md" }] },
  { "Project" = [{ "Release notes and milestones" = "release-notes.md" }, { "Compatibility" = "compatibility.md" }, { "Release process" = "releasing.md" }, { "Develop GND" = "development/index.md" }, { "Write documentation" = "development/documentation.md" }, { "Tested candidate" = "development/candidate.md" }] }
]

[project.theme]
custom_dir = "overrides"
variant = "modern"
features = ["navigation.tabs", "navigation.sections", "navigation.footer", "navigation.top", "content.code.copy", "search.highlight"]
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "orange"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.snippets" = { check_paths = true, restrict_base_path = true }

[project.validation.links]
not_found = "warn"
anchors = "warn"
unrecognized_links = "warn"
