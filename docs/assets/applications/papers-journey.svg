<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><title id="title">From a stack of papers to checked answers, in three acts</title><desc id="desc">Act 1, who is who and who said what: read each paper into statements with their passage, speaker and polarity; review them; decide which names are the same method. Act 2, one vocabulary: extract every paper against one shared vocabulary, merge spellings, check against a reference catalogue, and get advice on publication order. Act 3, depth and change: answer a scientist's questions or say unknown, read in passes with coverage, revise the vocabulary and see what goes stale, and give each derived claim a verdict.</desc><style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:15px} .title{font-size:21px;font-weight:700} .act{font-size:13px;font-weight:700;letter-spacing:.06em} .head{font-size:17px;font-weight:700} .mid{text-anchor:middle} .edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="760" height="330" fill="#fff" stroke="none"/>
<text x="24" y="36" class="title">From a stack of papers to answers you can check</text>
<rect x="24" y="60" width="96" height="236" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="38" y="84" width="68" height="40" rx="4" fill="#fff" stroke="#94a3b8"/><rect x="44" y="96" width="68" height="40" rx="4" fill="#fff" stroke="#94a3b8"/><rect x="50" y="108" width="56" height="40" rx="4" fill="#fff" stroke="#94a3b8"/>
<text x="72" y="190" class="mid head">16</text><text x="72" y="212" class="mid">papers</text><text x="72" y="232" class="mid" font-size="13">11 fields</text>
<path d="M122 178H140" class="edge"/>
<rect x="144" y="60" width="190" height="236" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="160" y="86" class="act" fill="#1d4ed8">ACT 1</text><text x="160" y="110" class="head">Who is who</text>
<text x="160" y="140">Keep who said it,</text><text x="160" y="160">and the passage</text><text x="160" y="190">Review each</text><text x="160" y="210">statement</text><text x="160" y="240">Decide same or</text><text x="160" y="260">different names</text>
<path d="M336 178H354" class="edge"/>
<rect x="358" y="60" width="190" height="236" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="374" y="86" class="act" fill="#047857">ACT 2</text><text x="374" y="110" class="head">One vocabulary</text>
<text x="374" y="140">Read every paper</text><text x="374" y="160">the same way</text><text x="374" y="190">Merge spellings,</text><text x="374" y="210">check a catalogue</text><text x="374" y="240">Flag dates that</text><text x="374" y="260">run backwards</text>
<path d="M550 178H568" class="edge"/>
<rect x="572" y="60" width="164" height="236" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="588" y="86" class="act" fill="#c2410c">ACT 3</text><text x="588" y="110" class="head">Depth, change</text>
<text x="588" y="140">Answer, or say</text><text x="588" y="160">"unknown"</text><text x="588" y="190">Know what was</text><text x="588" y="210">not read</text><text x="588" y="240">Revise and give</text><text x="588" y="260">claims a verdict</text>
</svg>
