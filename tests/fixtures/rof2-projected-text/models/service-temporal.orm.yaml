version: 3
model_id: urn:gnd-fixture:rof2-service-temporal@1
source: { kind: text-conversation, confidence: standard, mode: one-shot }
object_types:
  - { id: customer_code, name: CustomerCode, kind: value, primitive: String }
  - { id: sla_days, name: SlaDays, kind: value, primitive: Duration }
  - { id: window_days, name: WindowDays, kind: value, primitive: Duration }
fact_types:
  - id: has_sla
    reading: "{CustomerCode} has service level {SlaDays}"
    roles:
      - { object_type: customer_code, role_name: customer }
      - { object_type: sla_days, role_name: sla }
    constraints:
      - id: one_sla_per_customer
        type: uniqueness
        scope: internal
        roles: [customer]
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "Each customer has at most one service level." }
  - id: has_window
    reading: "{CustomerCode} has contact window {WindowDays}"
    roles:
      - { object_type: customer_code, role_name: customer }
      - { object_type: window_days, role_name: window }
    constraints:
      - id: one_window_per_customer
        type: uniqueness
        scope: internal
        roles: [customer]
        source: explicit
        status: confirmed
        modality: deontic
        provenance: { user_quote: "A customer should have at most one contact window." }
operations:
  - id: set_window
    reading: "{CustomerCode} is given contact window {WindowDays}"
    parameters:
      - { name: customer, object_type: customer_code }
      - { name: window, object_type: window_days }
    effects:
      - assert: { fact_type: has_window, bind: { customer: "$customer", window: "$window" } }
    frame: { modality: alethic }
    source: explicit
    status: confirmed
    provenance: { user_quote: "A customer may be given a contact window." }
rejected_proposals: []
