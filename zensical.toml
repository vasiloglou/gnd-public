[project]
site_name = "GND"
site_description = "Build applications around explicit domain rules."
site_url = "https://vasiloglou.github.io/gnd-public/"
repo_url = "https://github.com/vasiloglou/gnd-public"
repo_name = "gnd-public"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/styles.css"]
nav = [
  { "Overview" = [{ "What is GND?" = "index.md" }, { "Core concepts" = "concepts.md" }, { "Application gallery" = "applications.md" }] },
  { "Get started" = [{ "Install GND" = "installation.md" }, { "Check and repair" = "quickstart.md" }, { "Release dependencies" = "release-example.md" }] },
  { "Build BookRec" = [{ "1. Model the problem" = "bookrec/01-model.md" }, { "2. Facts and rules" = "bookrec/02-facts.md" }, { "3. Generate a project" = "bookrec/03-project.md" }, { "4. Build the application" = "bookrec/04-application.md" }, { "5. Diagnose and repair" = "bookrec/05-repair.md" }, { "6. Evolve the rules" = "bookrec/06-evolution.md" }] },
  { "Expense approvals" = [{ "1. Model the workflow" = "expense/01-model.md" }, { "2. Build and check" = "expense/02-application.md" }, { "3. Add currencies" = "expense/03-evolution.md" }] },
  { "Guides" = [{ "Models and constraints" = "guides/modeling.md" }, { "Data and transitions" = "guides/data-and-transitions.md" }, { "Synthetic data" = "guides/synthetic-data.md" }, { "Generated projects" = "guides/generated-projects.md" }, { "Evolution and recovery" = "guides/evolution-and-recovery.md" }, { "Documents and extraction" = "guides/documents.md" }, { "Experiment sessions" = "guides/experiments.md" }, { "Exports and witnesses" = "guides/exports.md" }, { "Coding-agent workflows" = "guides/agent-skills.md" }] },
  { "Reference" = [{ "Supported capabilities" = "reference/capabilities.md" }, { "CLI task index" = "reference/cli.md" }, { "Python API" = "reference/python-api.md" }, { "Formats and errors" = "reference/formats.md" }, { "Compatibility" = "compatibility.md" }, { "Support" = "support.md" }] },
  { "Contributing" = [{ "Develop GND" = "development/index.md" }, { "Write documentation" = "development/documentation.md" }, { "Tested candidate" = "development/candidate.md" }, { "Release process" = "releasing.md" }, { "Release notes" = "release-notes.md" }] }
]

[project.theme]
custom_dir = "overrides"
variant = "modern"
features = ["navigation.tabs", "navigation.sections", "navigation.footer", "navigation.top", "content.code.copy", "search.highlight"]
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "orange"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }

[project.validation.links]
not_found = "warn"
anchors = "warn"
unrecognized_links = "warn"
