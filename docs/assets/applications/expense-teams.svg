<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Two teams, one expense form</title>
<desc id="desc">Finance's shared expense model supplies the same definitions to Engineering and Sales. Engineering allows meals up to 75 EUR and team leads up to 100 EUR, with advisory receipts. Sales allows meals up to 120 EUR and team leads up to 1000 EUR, with mandatory receipts. The same 90 EUR dinner fails Engineering's rule and passes Sales's. A missing receipt warns Engineering but blocks Sales.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60768d"/></marker></defs>
<rect width="1100" height="570" rx="16" fill="#f4f7fb"/>
<g font-family="system-ui,sans-serif" fill="#17304a">
<rect x="215" y="20" width="670" height="104" rx="12" fill="#e1ebf7" stroke="#6c8baa"/>
<text x="550" y="53" text-anchor="middle" font-size="24" font-weight="700">One shared expense model</text>
<text x="550" y="82" text-anchor="middle" font-size="18">Expense · Employee · Amount · Category · Approval · Receipt</text>
<text x="550" y="108" text-anchor="middle" font-size="17">Owned by Finance</text>
<path d="M390 124V155H280V188M710 124V155H820V188" fill="none" stroke="#60768d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="194" width="490" height="300" rx="12" fill="white" stroke="#879bae"/>
<rect x="575" y="194" width="490" height="300" rx="12" fill="white" stroke="#879bae"/>
<text x="60" y="230" font-size="24" font-weight="700">Engineering's policy</text>
<text x="600" y="230" font-size="24" font-weight="700">Sales's policy</text>
<text x="60" y="265" font-size="19">Meals ≤ 75 EUR · Team leads ≤ 100 EUR</text>
<text x="600" y="265" font-size="19">Meals ≤ 120 EUR · Team leads ≤ 1,000 EUR</text>
<text x="60" y="296" font-size="19">An expense should have a receipt</text>
<text x="600" y="296" font-size="19">An expense must have a receipt</text>
<line x1="60" y1="322" x2="500" y2="322" stroke="#dde4eb"/>
<line x1="600" y1="322" x2="1040" y2="322" stroke="#dde4eb"/>
<text x="60" y="359" font-size="19">The same 90 EUR dinner</text>
<text x="600" y="359" font-size="19">The same 90 EUR dinner</text>
<text x="60" y="390" font-size="21" fill="#a9313d" font-weight="700">Blocked</text>
<text x="600" y="390" font-size="21" fill="#236a4a" font-weight="700">Accepted</text>
<text x="60" y="433" font-size="19">Expense 102 has no receipt</text>
<text x="600" y="433" font-size="19">Expense 102 has no receipt</text>
<text x="60" y="465" font-size="21" fill="#94600e" font-weight="700">Warning · work can continue</text>
<text x="600" y="465" font-size="21" fill="#a9313d" font-weight="700">Violation · add the receipt</text>
<text x="550" y="536" text-anchor="middle" font-size="20">Same expenses. Same definitions. Each team's own rules.</text>
</g></svg>
