<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" role="img" aria-labelledby="title desc"><title id="title">Approved releases are reviewed and requested</title><desc id="desc">Approved is contained in reviewed, which is contained in requested. REL-103 is reviewed but pending, outside approved. Subset transitivity proves approved is requested; the converse fails.</desc><rect width="850" height="260" rx="16" fill="#f8fafc"/><rect x="25" y="20" width="800" height="210" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><rect x="85" y="75" width="690" height="135" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="145" y="125" width="380" height="65" rx="12" fill="#d1fae5" stroke="#047857" stroke-width="2"/><g fill="#0f172a" font-family="sans-serif" font-size="20"><text x="45" y="50">Requested</text><text x="105" y="105">Reviewed</text><text x="165" y="165">Approved: REL-101, 102, 104, 105</text><text x="550" y="158">REL-103: pending</text><text x="180" y="250" font-size="18">Approved ⊆ Reviewed ⊆ Requested · Reviewed ⊄ Approved</text></g></svg>
