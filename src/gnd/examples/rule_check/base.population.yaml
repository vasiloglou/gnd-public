# The catalog on main: the saved state the change is compared against.
population:
  model: model.orm.yaml
  model_id: urn:gnd-example:rule-check@1
  source: tool-output
  producer: "components-scan 1.4.0 @ 4e1d0a7"
  covers: [component_imports_component, component_is_in_area, component_has_owner, component_ships_in_release]
facts:
  component_imports_component:
    - { importer: web, imported: api }
    - { importer: api, imported: auth }
    - { importer: auth, imported: api }
    - { importer: api, imported: db }
    - { importer: api, imported: cache }
    - { importer: billing, imported: db }
    - { importer: admin, imported: api }
    - { importer: web, imported: search }
    - { importer: search, imported: db }
    - { importer: metrics, imported: db }
    - { importer: legacy_ui, imported: api }
    - { importer: reports, imported: billing }
    - { importer: billing, imported: reports }
  component_is_in_area:
    - { component: web, area: core }
    - { component: api, area: core }
    - { component: auth, area: core }
    - { component: db, area: core }
    - { component: cache, area: core }
    - { component: billing, area: core }
    - { component: reports, area: core }
    - { component: search, area: core }
    - { component: util, area: core }
    - { component: metrics, area: core }
    - { component: admin, area: core }
    - { component: legacy_ui, area: legacy }
  component_has_owner:
    - { component: web, owner: platform }
    - { component: api, owner: platform }
    - { component: auth, owner: platform }
    - { component: db, owner: platform }
    - { component: cache, owner: platform }
    - { component: billing, owner: platform }
    - { component: reports, owner: platform }
    - { component: search, owner: platform }
    - { component: util, owner: platform }
    - { component: admin, owner: platform }
    - { component: legacy_ui, owner: platform }
  component_ships_in_release: []
