%YAML 1.1
---
version: 0.3.0.dev0
name: gnd_model_mapping
ontology_ref:
  name: gnd_model
  iri: ./ontology.yaml
semantic_model_ref:
  name: gnd_model_relational
  iri: ./ontology.yaml.semantic_model.yaml
concept_mappings:
- concept: Country
  object_mappings:
  - expression: '"COUNTRY"."COUNTRY_CODE"'
  link_mappings:
  - object_mapping:
      expression: '"COUNTRY"."COUNTRY_CODE"'
    children:
    - object_mapping:
        concept: CountryName
        expression: '"COUNTRY"."NAME"'
      relationship: country_has_name
- concept: State
  object_mappings:
  - referent_mappings:
    - relationship: state_in_country
      referent_mappings:
      - relationship: gnd_reference
        expression: '"STATE"."COUNTRY_COUNTRY_CODE"'
    - relationship: state_has_code
      expression: '"STATE"."CODE"'
  link_mappings:
  - object_mapping:
      referent_mappings:
      - relationship: state_in_country
        referent_mappings:
        - relationship: gnd_reference
          expression: '"STATE"."COUNTRY_COUNTRY_CODE"'
      - relationship: state_has_code
        expression: '"STATE"."CODE"'
    children:
    - object_mapping:
        concept: Country
        expression: '"STATE"."COUNTRY_COUNTRY_CODE"'
      relationship: state_in_country
  - object_mapping:
      referent_mappings:
      - relationship: state_in_country
        referent_mappings:
        - relationship: gnd_reference
          expression: '"STATE"."COUNTRY_COUNTRY_CODE"'
      - relationship: state_has_code
        expression: '"STATE"."CODE"'
    children:
    - object_mapping:
        concept: StateCode
        expression: '"STATE"."CODE"'
      relationship: state_has_code
  - object_mapping:
      referent_mappings:
      - relationship: state_in_country
        referent_mappings:
        - relationship: gnd_reference
          expression: '"STATE"."COUNTRY_COUNTRY_CODE"'
      - relationship: state_has_code
        expression: '"STATE"."CODE"'
    children:
    - object_mapping:
        concept: Population
        expression: '"STATE"."POPULATION"'
      relationship: state_has_population
- concept: City
  object_mappings:
  - expression: '"CITY"."CITY_ID"'
  link_mappings:
  - object_mapping:
      expression: '"CITY"."CITY_ID"'
    children:
    - object_mapping:
        concept: State
        referent_mappings:
        - relationship: state_in_country
          referent_mappings:
          - relationship: gnd_reference
            expression: '"CITY"."STATE_COUNTRY_COUNTRY_CODE"'
        - relationship: state_has_code
          expression: '"CITY"."STATE_CODE"'
      relationship: city_in_state
custom_extensions:
- vendor_name: GND
  data: '{"concepts":[],"dispositions":[{"carried_as":["primary_key","state"],"id":"constraints/0","kind":"constraint","reason":null},{"carried_as":["placement","city"],"id":"fact_types/city_in_state/constraints/0","kind":"constraint","reason":null},{"carried_as":["not_null","city","state_country_country_code","state_code"],"id":"fact_types/city_in_state/constraints/1","kind":"constraint","reason":null},{"carried_as":["placement","country"],"id":"fact_types/country_has_name/constraints/0","kind":"constraint","reason":null},{"carried_as":["primary_key","state"],"id":"fact_types/state_has_code/constraints/0","kind":"constraint","reason":null},{"carried_as":["primary_key","state"],"id":"fact_types/state_has_code/constraints/1","kind":"constraint","reason":null},{"carried_as":["placement","state"],"id":"fact_types/state_has_population/constraints/0","kind":"constraint","reason":null},{"carried_as":["primary_key","state"],"id":"fact_types/state_in_country/constraints/0","kind":"constraint","reason":null},{"carried_as":["primary_key","state"],"id":"fact_types/state_in_country/constraints/1","kind":"constraint","reason":null},{"carried_as":["columns","city","state_country_country_code","state_code"],"id":"city_in_state","kind":"fact_type","reason":null},{"carried_as":["columns","country","name"],"id":"country_has_name","kind":"fact_type","reason":null},{"carried_as":["key","state","code"],"id":"state_has_code","kind":"fact_type","reason":null},{"carried_as":["columns","state","population"],"id":"state_has_population","kind":"fact_type","reason":null},{"carried_as":["key","state","country_country_code"],"id":"state_in_country","kind":"fact_type","reason":null}],"model_identity":"sha256:9385a7e650141519876cd379a9d0842699b1fc14ca6eac51e06838ebe7844537","ontology_sha256":"4d6e3d1ddc063f9fd4496d046f13b0bb85a0abb9b491f289f3b08fde579a75dc","rmap_variant":"halpin","schema":"gnd-ossie-relational/1","semantic_model_sha256":"65677c537a08dfa86f4552f8c8b3b1c5cbd5c415980b02ceca9b5d21aff