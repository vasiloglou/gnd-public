--gf-fail-bg)}#gnd-orm-d2 .s-warn{stroke:var(--gf-warn)}#gnd-orm-d2 .s-warn-bg{stroke:var(--gf-warn-bg)}#gnd-orm-d2 .s-bubble{stroke:var(--gf-bubble)}#gnd-orm-d2 .s-bubble-ink{stroke:var(--gf-bubble-ink)}#gnd-orm-d2 .s-code{stroke:var(--gf-code)}#gnd-orm-d2 .s-alethic{stroke:var(--gf-alethic)}#gnd-orm-d2 .s-deontic{stroke:var(--gf-deontic)}#gnd-orm-d2 .sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}#gnd-orm-d2 .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;white-space:pre}#gnd-orm-d2 .nofill{fill:none}</style>
