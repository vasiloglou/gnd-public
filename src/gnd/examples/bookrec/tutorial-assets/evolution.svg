<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 710" role="img" aria-labelledby="title desc"><title id="title">Rules evolve; queries remain owned</title><desc id="desc">Same Ada cosmos/map candidate warns under advisory genre policy, fails strict genre policy; preferred repair yields map/river. Complete publishes all five eligible pairs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:18px} .title{font-size:24px;font-weight:700} .small{font-size:16px} .strong{font-weight:700} rect{stroke:#50657a;stroke-width:1.5} .edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="560" height="710" fill="#fff" stroke="none"/>
<text x="24" y="40" class="title">Rules evolve; queries remain owned</text>
<rect x="24" y="76" width="512" height="90" rx="12" fill="#eef5f8"/>
<text x="40" y="106" class="strong">Same candidate: Ada → cosmos, map</text>
<text x="40" y="135" class="">Ben → night is preserved</text>
