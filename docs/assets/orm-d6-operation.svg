  <line class="s-ink" stroke-width="1.6" x1="632" x2="660" y1="80" y2="80"/>
  <g>
    <rect class="f-card s-primary" height="52" rx="12" stroke-dasharray="6 4" stroke-width="2" width="120" x="660" y="54"/>
    <text class="sans f-ink" font-size="16" font-weight="600" text-anchor="middle" x="720" y="85">Status</text>
  </g>
  <g>
    <rect class="f-card s-ink" height="22" stroke-width="1.6" width="36" x="560" y="229"/>
    <rect class="f-card s-ink" height="22" stroke-width="1.6" width="36" x="596" y="229"/>
  </g>
  <line class="s-alethic" stroke-linecap="round" stroke-width="2.6" x1="563" x2="593" y1="223" y2="223"/>
  <line class="s-ink" stroke-width="1.6" x1="632" x2="660" y1="240" y2="240"/>
  <g>
    <rect class="f-card s-primary" height="52" rx="12" stroke-width="2" width="120" x="660" y="214"/>
    <text class="sans f-ink" font-size="16" font-weight="600" text-anchor="middle" x="720" y="237">Approver</text>
    <text class="sans f-muted" font-size="12" text-anchor="middle" x="720" y="255">(.name)</text>
  </g>
  <text class="sans f-ink" font-size="15" font-style="italic" text-anchor="middle" x="596" y="120">… has status …</text>
  <text class="sans f-ink" font-size="15" font-style="italic" text-anchor="middle" x="596" y="280">… is approved by …</text>
