<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 710" role="img" aria-labelledby="title desc"><title id="title">Two ceilings govern an approval</title><desc id="desc">101 meal 60 is below meals 75 and team-lead 100 EUR. Expense 102 travel 800 fits travel 2000 but fails team-lead 100; finance 3000 accepts it.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:18px} .title{font-size:24px;font-weight:700} .small{font-size:16px} .strong{font-weight:700} rect{stroke:#50657a;stroke-width:1.5} .edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="560" height="710" fill="#fff" stroke="none"/>
<text x="24" y="40" class="title">Two ceilings govern an approval</text>
<text x="24" y="82" class="strong">Amounts and all ceilings are EUR</text>
<rect x="24" y="110" width="512" height="105" rx="12" fill="#e9f4ec"/>
<text x="40" y="140" class="strong">101 · meals 60 → team-lead</text>
<text x="40" y="169" class="">60 ≤ category 75 and chain 100</text>
<text x="40" y="196" class="">PASS: checked approval published</text>
<text x="24" y="260" class="strong">Category caps (EUR)</text>
<text x="24" y="286" class="">meals</text>
<rect x="164" y="268" width="12" height="22" fill="#cce4ea"/>
<text x="477" y="286" class="">75</text>
<text x="24" y="325" class="">training</text>
<rect x="164" y="307" width="150.0" height="22" fill="#cce4ea"/>
<text x="477" y="325" class="">1500</text>
<text x="24" y="364" class="">travel</text>
<rect x="164" y="346" width="200.0" height="22" fill="#cce4ea"/>
<text x="477" y="364" class="">2000</text>
<text x="24" y="403" class="">equipment</text>
<rect x="164" y="385" width="300.0" height="22" fill="#cce4ea"/>
<text x="477" y="403" class="">3000</text>
<rect x="24" y="454" width="512" height="111" rx="12" fill="#fff0e4"/>
<text x="40" y="484" class="strong">102 · travel 800 → team-lead</text>
<text x="40" y="513" class="">Category PASS: 800 ≤ 2000</text>
<text x="40" y="540" class="">FAIL: approval_limit_team_lead (800 &gt; 100)</text>
<path class="edge" d="M280 565L280 595"/>
<rect x="24" y="602" width="512" height="88" rx="12" fill="#e9f4ec"/>
<text x="40" y="632" class="strong">Repair: 102 → finance</text>
<text x="40" y="661" class="">800 ≤ 3000; checked approval accepted</text>
</svg>
