  <text class="sans f-ink" font-size="15" font-style="italic" text-anchor="middle" x="360" y="154">… has primary genre …</text>
  <text class="sans f-muted" font-size="13" x="60" y="196">Bar over the Book role: at most one primary genre per book.</text>
