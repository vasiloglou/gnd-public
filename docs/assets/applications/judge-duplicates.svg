<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><title id="title">The four groups of the duplicates round and their verdicts</title><desc id="desc">Four groups of 24 rows each, g0 to g3, compared with two candidates, Item has dimension AttributeValue and Item has colour Colour. g0 shares every pair with has dimension, which was induced from the same attribute: duplicate by R1. g1 shares every pair with has colour: duplicate by R2. g2 shares no pair with either: distinct by R3, resting on the absence of shared facts. g3 shares half its pairs with has colour: R4, asked; you answered distinct. g2 and g3 are proposed as item_has_attribute_induced_2 and _3; g0 and g1 are listed as judged shape matches.</desc><style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:18px} .title{font-size:24px;font-weight:700} .small{font-size:15px} .tiny{font-size:13px} .strong{font-weight:700} .mid{text-anchor:middle} rect{stroke:#50657a;stroke-width:1.5} .edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px} .track{fill:#fff;stroke:#50657a} .fill{fill:#50657a;stroke:none} .same{fill:#b45309;stroke:none} .green{fill:#1f7a4d;font-weight:700} .orange{fill:#b45309;font-weight:700} .muted{fill:#50657a} .line{stroke:#c9d4dc;stroke-width:1}</style><rect width="640" height="600" fill="#fff" stroke="none"/>
