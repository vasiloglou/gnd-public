<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">One shared vocabulary, a project's own rule</title>
<desc id="desc">The tool owns a vocabulary saying which component imports another. The project pins that file and owns the no-import-loops rule. GND verifies the pin and checks the composed model against scanner facts. The api and auth components form a loop, so the project's rule reports a failure and its remedy.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="390" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172554">
<rect x="24" y="24" width="282" height="135" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
<text x="44" y="53" font-size="13" font-weight="bold" fill="#0369a1">TOOL OWNS THE VOCABULARY</text>
<text x="44" y="85" font-size="17" font-weight="bold">components-v1.orm.yaml</text>
<text x="44" y="116" font-size="16">Component imports Component</text>
<text x="44" y="140" font-size="14">Types and facts, shared across projects</text>
<rect x="24" y="183" width="282" height="175" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
<text x="44" y="212" font-size="13" font-weight="bold" fill="#6d28d9">PROJECT OWNS THE RULE</text>
<text x="44" y="243" font-size="17" font-weight="bold">project.orm.yaml</text>
<text x="44" y="273" font-size="15">Pins vocabulary by sha256</text>
<text x="44" y="300" font-size="15">Adds no_import_loops</text>
<text x="44" y="327" font-size="14">Keeps its rationale and remedy</text>
<path d="M310 90 H358 V166 H389 M310 265 H358 V196 H389" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="395" y="132" width="190" height="100" rx="12" fill="#fff" stroke="#64748b"/>
<text x="490" y="164" font-size="17" text-anchor="middle" font-weight="bold">GND check</text>
<text x="490" y="191" font-size="14" text-anchor="middle">Verify the pin</text>
<text x="490" y="213" font-size="14" text-anchor="middle">Check the composed model</text>
<path d="M590 182 H625 V225 H655" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="24" width="316" height="135" rx="12" fill="#fff" stroke="#64748b"/>
<text x="682" y="53" font-size="13" font-weight="bold">SCANNER FACTS</text>
<text x="682" y="88" font-size="18">web → api → auth</text>
<text x="754" y="121" font-size="18" fill="#b91c1c">api ← auth</text>
<text x="682" y="144" font-size="13">api and auth import each other</text>
<path d="M818 164 V184" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="191" width="316" height="167" rx="12" fill="#fef2f2" stroke="#dc2626"/>
<text x="682" y="221" font-size="17" font-weight="bold" fill="#b91c1c">FAIL · no_import_loops</text>
<text x="682" y="252" font-size="15">One loop, two components, two edges</text>
<text x="682" y="285" font-size="13" font-weight="bold">THE PROJECT'S REMEDY</text>
<text x="682" y="311" font-size="14">Move shared code into a lower</text>
<text x="682" y="334" font-size="14">component both can import.</text>
</g></svg>
