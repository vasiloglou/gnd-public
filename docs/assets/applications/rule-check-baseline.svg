<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc">
<defs><marker id="a-plain" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#94a3b8"/></marker><marker id="a-standing" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker><marker id="a-new" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b45309"/></marker><marker id="a-resolved" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#15803d"/></marker></defs>
<title id="title">The change under review, against main</title>
<desc id="desc">Part of the component graph of the change under review; cache, admin and four imports that break no rule are left out. The import loop between api and auth was already on main: its two rows are standing. The change adds a loop between search and util: its two rows are new. The loop between reports and billing on main is gone, because billing no longer imports reports; reports still imports billing, outside any loop, so both rows the loop gave on main are resolved. The component legacy_ui, in the legacy area, and metrics, which has no owner, were already like this on main: standing.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:16px} .title{font-size:22px;font-weight:700} .small{font-size:14px} .mid{text-anchor:middle} .mono{font-family:ui-monospace,Menlo,monospace;font-size:15px} rect.node{fill:#eef5f8;stroke:#50657a;stroke-width:1.5} rect.flag{fill:#fff;stroke:#334155;stroke-width:2.5} .plain{stroke:#94a3b8;stroke-width:1.5;marker-end:url(#a-plain)} .standing{stroke:#334155;stroke-width:3;marker-end:url(#a-standing)} .new{stroke:#b45309;stroke-width:3;marker-end:url(#a-new)} .resolved{stroke:#15803d;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#a-resolved)} .tnew{fill:#b45309;font-weight:700} .tstanding{fill:#334155;font-weight:700} .tresolved{fill:#15803d;font-weight:700}</style>
