<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><title id="title">Round 1: a returns note adds one fact type</title><desc id="desc">A returns desk note says a returned order comes back through one of the shop's channels. The program proposes one addition, Order is returned via Channel, drawn in green beside the existing Order arrives via Channel. Both connect Order and Channel, so the shape report names arrives via as a candidate. GND admits the round under the additive policy: breaking false, affected order_returned_via_channel.</desc><style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:18px} .title{font-size:24px;font-weight:700} .small{font-size:16px} .strong{font-weight:700} .mid{text-anchor:middle} rect{stroke:#50657a;stroke-width:1.5} .value{stroke-dasharray:6 4} .role{fill:#fff;stroke:#334155;stroke-width:1.5} .line{stroke:#334155;stroke-width:2;fill:none} .derived{stroke-dasharray:4 4} .new{stroke:#1f7a4d} .newfill{fill:#e9f4ec;stroke:#1f7a4d} .newtext{fill:#1f7a4d;font-weight:700} .edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="640" fill="#fff" stroke="none"/>
<text x="24" y="40" class="title">Round 1: a returns note adds one fact type</text>
<rect x="24" y="62" width="592" height="92" rx="12" fill="#fff"/>
<text x="40" y="90" class="strong">New document · returns desk note</text>
<text x="40" y="117" class="small">"A returned order comes back through one of our channels,</text>
<text x="40" y="140" class="small">which need not be the channel it arrived by."</text>
<path class="edge" d="M320 154L320 182"/>
<text x="332" y="176" class="small">the program proposes one addition</text>
<rect x="24" y="230" width="120" height="60" rx="12" fill="#eef5f8"/>
<text x="84" y="255" class="strong mid">Customer</text>
<text x="84" y="277" class="small mid">CustomerNo</text>
<rect x="260" y="230" width="120" height="60" rx="12" fill="#eef5f8"/>
<text x="320" y="255" class="strong mid">Order</text>
<text x="320" y="277" class="small mid">OrderNo</text>
<rect x="496" y="230" width="120" height="60" rx="12" fill="#eef5f8" class="value"/>
<text x="556" y="255" class="strong mid">Channel</text>
<text x="556" y="277" class="small mid">text</text>
<path class="line" d="M144 260L260 260"/>
<rect x="178" y="251" width="24" height="18" class="role"/>
<rect x="202" y="251" width="24" height="18" class="role"/>
<text x="202" y="218" class="small mid">Order is placed by Customer</text>
<path class="line" d="M380 246L496 246"/>
<rect x="414" y="237" width="24" height="18" class="role"/>
<rect x="438" y="237" width="24" height="18" class="role"/>
<text x="438" y="218" class="small mid">Order arrives via Channel</text>
<path class="line new" d="M380 278L496 278"/>
<rect x="414" y="269" width="24" height="18" class="role newfill"/>
<rect x="438" y="269" width="24" height="18" class="role newfill"/>
<text x="438" y="320" class="small mid newtext">NEW · Order is returned via Channel</text>
<text x="438" y="344" class="small mid">same role players as "arrives via"</text>
<path class="line derived" d="M84 290L84 336"/>
<rect x="72" y="336" width="24" height="18" class="role"/>
<text x="84" y="382" class="small mid">Customer is active *</text>
<rect x="24" y="416" width="592" height="130" rx="12" fill="#e9f4ec"/>
<text x="40" y="446" class="strong">GND says · admitted under the additive policy</text>
<text x="40" y="475" class="">breaking: false · affected: order_returned_via_channel</text>
<text x="40" y="502" class="">shape report: added order_returned_via_channel</text>
<text x="165" y="529" class="">existing order_arrives_via_channel</text>
<text x="24" y="584" class="small">* derived from "is placed by"; unchanged this round.</text>
<text x="24" y="612" class="small">A candidate, not a duplicate: whether the two mean the same thing is your call.</text>
</svg>
