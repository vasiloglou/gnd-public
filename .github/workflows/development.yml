name: Bounded development and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.10'
      - run: uv sync --locked --group dev
      - run: uv run gnd install --symlink --project --force
      - run: uv run gnd doctor --project
      - run: uv run pytest -q tests/test_development_scaffold.py tests/test_review_credential_launcher.py
      - name: Explicit bounded P2 distribution selection
        run: uv run pytest -q -o addopts='' tests/test_public_runtime.py tests/test_public_distribution.py
      - name: Reviewed P3 subset; full phase acceptance remains pending
        run: >-
          uv run pytest -q
          tests/test_address.py
          tests/test_adopt_migration.py
          tests/test_agent_cli.py
          tests/test_archsmoke.py
          tests/test_artifacts.py
          tests/test_atom_bind.py
          tests/test_checker_families.py
          tests/test_codegen_architecture.py
