<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="title desc"><title id="title">How GND checks application output</title><desc id="desc">Domain rules become a model. Application output becomes facts. GND checks the facts against the model. Passing facts can be published; findings guide an explicit repair and another check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#164f4b"/></marker></defs><rect width="800" height="310" rx="16" fill="#f1f4ef"/><g font-family="system-ui,sans-serif" fill="#183936"><text x="32" y="39" font-size="13" letter-spacing="2">TWO INPUTS. ONE EXPLICIT CHECK.</text><rect x="32" y="69" width="205" height="71" rx="9" fill="#fff" stroke="#b7cec5"/><text x="49" y="99" font-size="19" font-weight="600">The model</text><text x="49" y="123" font-size="13">What your domain requires</text><rect x="32" y="171" width="205" height="71" rx="9" fill="#fff" stroke="#b7cec5"/><text x="49" y="201" font-size="19" font-weight="600">Candidate facts</text><text x="49" y="225" font-size="13">Your application's output</text><path d="M239 105H282V155 M239 206H282V155 M282 155H321" fill="none" stroke="#164f4b" stroke-width="2" marker-end="url(#arrow)"/><circle cx="391" cy="155" r="68" fill="#164f4b"/><text x="391" y="152" fill="#fff" font-size="24" text-anchor="middle" font-weight="600">GND</text><text x="391" y="177" fill="#d1e6df" font-size="15" text-anchor="middle">check</text><path d="M460 155H500V105H551" fill="none" stroke="#164f4b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 155V206H551" fill="none" stroke="#164f4b" stroke-width="2" marker-end="url(#arrow)"/><rect x="561" y="69" width="206" height="71" rx="9" fill="#dcece3"/><text x="578" y="99" font-size="19" font-weight="600">Meets the rules</text><text x="578" y="123" font-size="13">Application may publish</text><rect x="561" y="171" width="206" height="71" rx="9" fill="#f7e0cf"/><text x="578" y="201" font-size="19" font-weight="600">A rule is violated</text><text x="578" y="225" font-size="13">Inspect the finding and repair</text><path d="M660 243V282H137V249" fill="none" stroke="#164f4b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="362" y="274" font-size="13">Explicit repair → check again</text></g></svg>