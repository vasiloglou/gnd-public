--gf-fail-bg)}#gnd-orm-d3 .s-warn{stroke:var(--gf-warn)}#gnd-orm-d3 .s-warn-bg{stroke:var(--gf-warn-bg)}#gnd-orm-d3 .s-bubble{stroke:var(--gf-bubble)}#gnd-orm-d3 .s-bubble-ink{stroke:var(--gf-bubble-ink)}#gnd-orm-d3 .s-code{stroke:var(--gf-code)}#gnd-orm-d3 .s-alethic{stroke:var(--gf-alethic)}#gnd-orm-d3 .s-deontic{stroke:var(--gf-deontic)}#gnd-orm-d3 .sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}#gnd-orm-d3 .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;white-space:pre}#gnd-orm-d3 .nofill{fill:none}</style>
  <rect class="f-bg" height="240" rx="16" width="720" x="0" y="0"/>
  <text class="sans f-muted" font-size="12" font-weight="600" letter-spacing="2" x="24" y="32">ORM 2 · UNIQUENESS AND MANDATORY</text>
