--gf-fail-bg)}#gnd-orm-d6 .s-warn{stroke:var(--gf-warn)}#gnd-orm-d6 .s-warn-bg{stroke:var(--gf-warn-bg)}#gnd-orm-d6 .s-bubble{stroke:var(--gf-bubble)}#gnd-orm-d6 .s-bubble-ink{stroke:var(--gf-bubble-ink)}#gnd-orm-d6 .s-code{stroke:var(--gf-code)}#gnd-orm-d6 .s-alethic{stroke:var(--gf-alethic)}#gnd-orm-d6 .s-deontic{stroke:var(--gf-deontic)}#gnd-orm-d6 .sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}#gnd-orm-d6 .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;white-space:pre}#gnd-orm-d6 .nofill{fill:none}</style>
  <rect class="f-bg" height="320" rx="16" width="800" x="0" y="0"/>
  <text class="sans f-muted" font-size="12" font-weight="600" letter-spacing="2" x="24" y="32">GND EXTENSION TO ORM 2 · OPERATIONS</text>
  <rect class="f-card s-accent" height="228" rx="12" stroke-width="2" width="300" x="30" y="56"/>
  <text class="mono f-ink" font-size="15" font-weight="700" x="48" xml:space="preserve" y="84">approve_expense</text>
  <text class="mono f-muted" font-size="13" x="48" xml:space="preserve" y="104">(expense, approver)</text>
  <text class="sans f-muted" font-size="11" font-weight="700" letter-spacing="1.5" x="48" y="132">REQUIRES</text>
  <text class="sans f-ink" font-size="13" x="48" y="151">Expense has status 'draft'</text>
  <text class="sans f-muted" font-size="11" font-weight="700" letter-spacing="1.5" x="48" y="179">RETRACTS · ASSERTS</text>
  <text class="sans f-ink" font-size="13" x="48" y="198">Expense has status 'approved'</text>
  <text class="sans f-ink" font-size="13" x="48" y="217">Expense is approved by Approver</text>
  <text class="sans f-muted" font-size="11" font-weight="700" letter-spacing="1.5" x="48" y="245">FRAME</text>
  <text class="sans f-ink" font-size="13" x="48" y="264">alethic: nothing else may change</text>
  <g>
