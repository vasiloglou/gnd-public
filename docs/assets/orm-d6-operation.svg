<svg aria-labelledby="gnd-orm-d6-title gnd-orm-d6-desc" class="gnd-figure" id="gnd-orm-d6" role="img" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <title id="gnd-orm-d6-title">An operation over ORM fact types</title>
  <desc id="gnd-orm-d6-desc">The operation approve_expense requires a draft status, retracts the old status, asserts 'approved' and the approver, and declares an alethic frame.</desc>
