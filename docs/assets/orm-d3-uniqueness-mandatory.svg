  </g>
  <g>
    <rect class="f-card s-primary" height="52" rx="12" stroke-dasharray="6 4" stroke-width="2" width="130" x="530" y="94"/>
    <text class="sans f-ink" font-size="16" font-weight="600" text-anchor="middle" x="595" y="125">Genre</text>
  </g>
  <line class="s-ink" stroke-width="1.6" x1="190" x2="324" y1="120" y2="120"/>
  <line class="s-ink" stroke-width="1.6" x1="396" x2="530" y1="120" y2="120"/>
