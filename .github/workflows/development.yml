name: Development and candidate acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.10'
      - name: Build retained candidate once
        run: |
          uv build --out-dir candidate/release
          mkdir -p candidate/source
          tar -xzf candidate/release/*.tar.gz -C candidate/source
          uv build --wheel candidate/source/* --out-dir "$PWD/candidate/comparison"
          git rev-parse HEAD > candidate/SOURCE_COMMIT
          python --version > candidate/BUILD_PROFILE
          uv --version >> candidate/BUILD_PROFILE
          cd candidate
          sha256sum release/* comparison/* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.run_id }}
          path: |
            candidate/release/
            candidate/comparison/
            candidate/SOURCE_COMMIT
            candidate/BUILD_PROFILE
            candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.10'
      - run: uv sync --locked --group dev
      - run: uv run gnd install --symlink --project --force
      - run: uv run gnd doctor --project
      - run: uv run pytest --collect-only -q
      - run: uv run pytest -q --tb=short
  installed:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ github.run_id }}
          path: candidate
      - run: test "$(cat candidate/SOURCE_COMMIT)" = "$(git rev-parse HEAD)"
      - run: uv sync --locked --group dev
      - name: Validate retained artifacts without rebuilding
        run: GND_CANDIDATE_DIR="$PWD/candidate" uv run pytest -q -o addopts='' tests/test_release_acceptance.py -s --tb=short
  phase2:
    name: phase2
    needs: [candidate, regression, installed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every acceptance job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'candidate', 'regression', 'installed'}
          assert all(value['result'] == 'success' for value in results.values()), results
          PY
