    <text class="sans f-ink" font-size="16" font-weight="600" text-anchor="middle" x="460" y="157">Expense</text>
    <text class="sans f-muted" font-size="12" text-anchor="middle" x="460" y="175">(.id)</text>
  </g>
  <line class="s-ink" stroke-width="1.6" x1="520" x2="560" y1="160" y2="80"/>
  <line class="s-ink" stroke-width="1.6" x1="520" x2="560" y1="160" y2="240"/>
  <g>
