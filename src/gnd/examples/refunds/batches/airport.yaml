# The airport store's refunds for one week. The auditors marked this batch flagged.
format_version: 2
population:
  model: model.orm.yaml
  model_id: refunds
  source: fixture
  covers: [refund_by, refund_amount, refund_channel]
instances:
  refund: [701, 702]
  customer: ["c-quin", "c-rae"]
