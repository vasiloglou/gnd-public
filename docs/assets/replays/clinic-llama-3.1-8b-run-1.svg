<svg xmlns="http://www.w3.org/2000/svg" id="replay-clinic-llama-3-1-8b-run-1" class="gnd-figure" role="img" viewBox="0 0 760 336" width="760" height="336" aria-labelledby="replay-clinic-llama-3-1-8b-run-1-title replay-clinic-llama-3-1-8b-run-1-desc">
<title id="replay-clinic-llama-3-1-8b-run-1-title">Llama 3.1 8B refills Sam&#x27;s prescriptions (recorded run 1)</title>
<desc id="replay-clinic-llama-3-1-8b-run-1-desc">A replay of a recorded session; the full text is in the transcript below the figure.</desc>
<style>:where(#replay-clinic-llama-3-1-8b-run-1){--gf-bg:#f1f4ef;--gf-card:#ffffff;--gf-line:#b7cec5;--gf-ink:#183936;--gf-muted:#5b6f6b;--gf-primary:#164f4b;--gf-accent:#b34e26;--gf-ok:#1f7a4d;--gf-ok-bg:#dcece3;--gf-fail:#b3261e;--gf-fail-bg:#f7dcd6;--gf-warn:#8a5e00;--gf-warn-bg:#fbecc2;--gf-bubble:#164f4b;--gf-bubble-ink:#ffffff;--gf-code:#f6f8f5;--gf-alethic:#6b3fa0;--gf-deontic:#1f5fa8}@media (prefers-color-scheme: dark){:where(#replay-clinic-llama-3-1-8b-run-1){--gf-bg:#1b2b28;--gf-card:#0f1917;--gf-line:#2d4440;--gf-ink:#e6efec;--gf-muted:#9fb3ae;--gf-primary:#7bd4c6;--gf-accent:#ffb38b;--gf-ok:#6fd39a;--gf-ok-bg:#163b2b;--gf-fail:#ff8f85;--gf-fail-bg:#4a1f1b;--gf-warn:#f2c14e;--gf-warn-bg:#4a3a10;--gf-bubble:#123d39;--gf-bubble-ink:#e6efec;--gf-code:#142320;--gf-alethic:#c3a6ff;--gf-deontic:#8ab8ff}}#replay-clinic-llama-3-1-8b-run-1 .c-head{fill:var(--gf-accent)}#replay-clinic-llama-3-1-8b-run-1 .c-ok{fill:var(--gf-ok)}#replay-clinic-llama-3-1-8b-run-1 .c-fail{fill:var(--gf-fail)}#replay-clinic-llama-3-1-8b-run-1 .c-pyrel{fill:var(--gf-primary)}#replay-clinic-llama-3-1-8b-run-1 .c-say{fill:var(--gf-warn)}#replay-clinic-llama-3-1-8b-run-1 .c-plan{fill:var(--gf-ink)}#replay-clinic-llama-3-1-8b-run-1 .c-ink{fill:var(--gf-ink)}#replay-clinic-llama-3-1-8b-run-1 .c-muted{fill:var(--gf-muted)}#replay-clinic-llama-3-1-8b-run-1 .bg{fill:var(--gf-code)}#replay-clinic-llama-3-1-8b-run-1 .frame{fill:var(--gf-card);stroke:var(--gf-line)}#replay-clinic-llama-3-1-8b-run-1 text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;white-space:pre}#replay-clinic-llama-3-1-8b-run-1 .title{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;fill:var(--gf-ink)}#replay-clinic-llama-3-1-8b-run-1 .l{animation:replay-clinic-llama-3-1-8b-run-1-in .3s ease-out both}@keyframes replay-clinic-llama-3-1-8b-run-1-in{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion: reduce){#replay-clinic-llama-3-1-8b-run-1 .l{animation:none}}</style>
<rect class="frame" x="0.5" y="0.5" width="759" height="335" rx="10"/>
<text class="title" x="18" y="27">Llama 3.1 8B refills Sam&#x27;s prescriptions (recorded run 1)</text>
<text class="l c-head" x="18" y="58" xml:space="preserve" style="animation-delay:0.00s">attempt 1</text>
<text class="l c-say" x="18" y="75" xml:space="preserve" style="animation-delay:0.22s">  the bot says: warfarin is not refilled because it would be given before the refill interval</text>
<text class="l c-say" x="18" y="92" xml:space="preserve" style="animation-delay:0.44s">      has passed since the last refill.</text>
<text class="l c-plan" x="18" y="109" xml:space="preserve" style="animation-delay:0.66s">  plan  refill_drug(patient='sam', drug='aspirin', on='2024-03-10')</text>
<text class="l c-plan" x="18" y="126" xml:space="preserve" style="animation-delay:0.88s">  plan  refill_drug(patient='sam', drug='statin', on='2024-03-10')</text>
<text class="l c-fail" x="18" y="143" xml:space="preserve" style="animation-delay:1.10s">  pyrel check: exit 1</text>
<text class="l c-ink" x="18" y="160" xml:space="preserve" style="animation-delay:1.32s">    states 0-2  pharmacist_judgement  not checked  (textual rule: The pharmacist uses judgement</text>
<text class="l c-ink" x="18" y="177" xml:space="preserve" style="animation-delay:1.54s">        for anything the rules don't cover.)</text>
<text class="l c-fail" x="18" y="194" xml:space="preserve" style="animation-delay:1.76s">    state 2  refill_not_early  violated  {"$d": "statin", "$last": "2024-02-20", "$n": 30,</text>
<text class="l c-fail" x="18" y="211" xml:space="preserve" style="animation-delay:1.98s">        "$on": "2024-03-10", "$p": "sam"}</text>
<text class="l c-pyrel" x="18" y="228" xml:space="preserve" style="animation-delay:2.20s">      the rule in PyRel: m.where(refill(step, p, d, on), last_refill(step, p, d, last),</text>
<text class="l c-pyrel" x="18" y="245" xml:space="preserve" style="animation-delay:2.42s">          refill_interval(step, d, n)).require(on &gt;= std_date.add(last, days(n)))</text>
<text class="l c-head" x="18" y="262" xml:space="preserve" style="animation-delay:2.64s">attempt 2</text>
<text class="l c-say" x="18" y="279" xml:space="preserve" style="animation-delay:2.86s">  the bot made no plan: attempted to refill stata_in_a_row which breaks rule: A patient should</text>
<text class="l c-say" x="18" y="296" xml:space="preserve" style="animation-delay:3.08s">      not get two drugs from the same class of reasons on the same day.</text>
<text class="l c-fail" x="18" y="313" xml:space="preserve" style="animation-delay:3.30s">no plan was made</text>
</svg>
