# tests/fixtures/checker/ring.orm.yaml
# Ring fixture model: one binary same-type fact type per ring variant in the
# meta-schema's ring enum, each carrying exactly that variant as an alethic
# constraint. Populations ring_pass / ring_fail exercise every variant.

version: 1

source:
  kind: text-conversation
  confidence: standard
  mode: guided

object_types:
  - id: node
    name: Node
    kind: entity
    reference: { mode: popular, value_type: node_id }

  - id: node_id
    name: NodeId
    kind: value
    primitive: Integer

fact_types:
  - id: rel_irreflexive
    reading: "{Node:a} relates-irreflexive {Node:b}"
    roles:
      - { object_type: node, role_name: a }
      - { object_type: node, role_name: b }
    constraints:
      - type: ring
        variant: irreflexive
        source: explicit
        status: confirmed
        modality: alethic
        provenance: { user_quote: "The irreflexive relation over nodes." }

  - id: rel_asymmetric
    reading: "{Node:a} relates-asymmetric {Node:b}"
