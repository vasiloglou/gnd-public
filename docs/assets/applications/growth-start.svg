<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc"><title id="title">The shop model before any round</title><desc id="desc">Three object types: Customer and Order are entities identified by a number, Channel is a value. Two fact types connect them: Order is placed by Customer, and Order arrives via Channel. A derived unary fact type, Customer is active, follows from an order being placed. GND already holds two sample facts: order 10 is placed by customer 1 and order 11 by customer 2. No constraints.</desc><style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:18px} .title{font-size:24px;font-weight:700} .small{font-size:16px} .strong{font-weight:700} .mid{text-anchor:middle} rect{stroke:#50657a;stroke-width:1.5} .value{stroke-dasharray:6 4} .role{fill:#fff;stroke:#334155;stroke-width:1.5} .line{stroke:#334155;stroke-width:2;fill:none} .derived{stroke-dasharray:4 4}</style><rect width="640" height="500" fill="#fff" stroke="none"/>
<text x="24" y="40" class="title">The shop model before any round</text>
<text x="24" y="70" class="small">Solid box: an entity and its identifier. Dashed box: a value. Squares: a fact type.</text>
<rect x="24" y="130" width="120" height="60" rx="12" fill="#eef5f8"/>
<text x="84" y="155" class="strong mid">Customer</text>
<text x="84" y="177" class="small mid">CustomerNo</text>
<rect x="260" y="130" width="120" height="60" rx="12" fill="#eef5f8"/>
<text x="320" y="155" class="strong mid">Order</text>
<text x="320" y="177" class="small mid">OrderNo</text>
<rect x="496" y="130" width="120" height="60" rx="12" fill="#eef5f8" class="value"/>
<text x="556" y="155" class="strong mid">Channel</text>
<text x="556" y="177" class="small mid">text</text>
<path class="line" d="M144 160L260 160"/>
<rect x="178" y="151" width="24" height="18" class="role"/>
<rect x="202" y="151" width="24" height="18" class="role"/>
<text x="202" y="118" class="small mid">Order is placed by Customer</text>
<path class="line" d="M380 160L496 160"/>
<rect x="414" y="151" width="24" height="18" class="role"/>
<rect x="438" y="151" width="24" height="18" class="role"/>
<text x="438" y="118" class="small mid">Order arrives via Channel</text>
<path class="line derived" d="M84 190L84 236"/>
<rect x="72" y="236" width="24" height="18" class="role"/>
<text x="84" y="282" class="small mid">Customer is active *</text>
<text x="24" y="318" class="small">* derived, not extracted: a customer who placed an order is active.</text>
<rect x="24" y="350" width="592" height="100" rx="12" fill="#eef5f8"/>
<text x="40" y="380" class="strong">Facts GND already holds (sample rows)</text>
<text x="40" y="409" class="">Order 10 is placed by Customer 1</text>
<text x="40" y="436" class="">Order 11 is placed by Customer 2</text>
<text x="24" y="484" class="small">No constraints yet: nothing says an order must have a customer or a channel.</text>
</svg>
