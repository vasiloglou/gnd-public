# IK3 approval corpus: person 3 has no grade
population:
  model: labels.orm.yaml
  source: fixture
  covers: [person_in_team, person_has_grade, team_led_by, person_has_skill]
instances:
  person: [1, 2, 3]
  team: ["A", "B"]
facts:
  person_in_team:
    - { person: 1, team: "A" }
    - { person: 2, team: "A" }
    - { person: 3, team: "B" }
  person_has_grade:
    - { person: 1, grade: "g1" }
    - { person: 2, grade: "g2" }
  team_led_by:
    - { team: "A", leader: 1 }
  person_has_skill:
    - { person: 1, skill: "s1" }
    - { person: 1, skill: "s2" }
    - { person: 2, skill: "s1" }
