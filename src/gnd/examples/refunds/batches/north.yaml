# The north store's refunds for one week. The auditors marked this batch clean.
format_version: 2
population:
  model: model.orm.yaml
  model_id: refunds
  source: fixture
  covers: [refund_by, refund_amount, refund_channel]
instances:
  refund: [101, 102, 103]
  customer: ["c-anna", "c-ben", "c-cara"]
