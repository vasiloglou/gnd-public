    provenance:
      user_quote: Each is unique.
  - type: mandatory
    role: state
    source: explicit
    status: confirmed
    modality: alethic
    provenance:
      user_quote: Each must have one.
- id: state_has_population
  reading: '{State} has {Population}'
  roles:
  - object_type: state
    role_name: state
  - object_type: population
