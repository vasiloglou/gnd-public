<svg aria-labelledby="gnd-orm-d2-title gnd-orm-d2-desc" class="gnd-figure" id="gnd-orm-d2" role="img" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <title id="gnd-orm-d2-title">An exclusion constraint in ORM 2 notation</title>
  <desc id="gnd-orm-d2-desc">User and Book are joined by two fact types, 'is recommended' and 'rated'. A circled cross connected to both role pairs says no pair may appear in both.</desc>
